<style>
/* Layout: one centered card per screen over a drifting field of hearts; single pastel theme by choice */
:root{
  --blush:#ffe4ee;
  --petal:#fff6f9;
  --rose:#f2709c;
  --rose-deep:#d6336c;
  --ink:#5a2a3f;
  --ink-soft:#8f5a72;
  --white:#ffffff;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  background:radial-gradient(120% 80% at 50% 0%, var(--petal) 0%, var(--blush) 70%, #ffd3e2 100%) fixed, var(--blush);
  color:var(--ink);font-family:var(--body);font-size:17px;
  overflow-x:hidden;overflow-y:auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
#hearts{position:fixed;inset:0;pointer-events:none;z-index:0}
.stage{position:relative;z-index:1;min-height:100%;display:grid;place-items:center;padding-block:56px 32px}
.screen{
  width:min(560px,100%);text-align:center;
  background:rgba(255,255,255,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1.5px solid rgba(242,112,156,.22);border-radius:32px;
  box-shadow:0 20px 60px -20px rgba(214,51,108,.35);
  padding:clamp(28px,6vw,48px) clamp(20px,5vw,40px);
  display:flex;flex-direction:column;align-items:center;gap:22px;
  animation:popIn .7s cubic-bezier(.2,.9,.3,1.2) both;
}
.screen.leaving{animation:popOut .5s ease-in both}
@keyframes popIn{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
@keyframes popOut{to{opacity:0;transform:translateY(-20px) scale(.96)}}
.tag{font-weight:800;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--rose)}
h1,h2{font-family:var(--display);font-weight:800;margin:0;line-height:1.15;text-wrap:balance;color:var(--ink)}
h1{font-size:clamp(1.9rem,6vw,2.6rem)}
h2{font-size:clamp(1.45rem,4.8vw,2rem)}
.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;width:100%}
button{font:inherit;cursor:pointer;border:0}
.btn{
  font-weight:800;font-size:1.05rem;padding:15px 26px;border-radius:999px;
  background:linear-gradient(180deg,#ff8db4,var(--rose));color:var(--white);
  box-shadow:0 8px 0 -2px var(--rose-deep),0 14px 24px -10px rgba(214,51,108,.6);
  transition:transform .15s ease, box-shadow .15s ease;
  flex:1 1 200px;max-width:100%;
}
.btn.alt{background:var(--white);color:var(--rose-deep);box-shadow:0 8px 0 -2px #f6b7cd,0 14px 24px -12px rgba(214,51,108,.4);border:2px solid #f6b7cd}
.btn:hover{transform:translateY(-3px) rotate(-1deg)}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 -2px var(--rose-deep)}
.btn:focus-visible,.music:focus-visible{outline:3px solid var(--rose-deep);outline-offset:4px}
.btn.solo{flex:0 1 auto}
.reply{font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(1.25rem,4.2vw,1.6rem);color:var(--rose-deep);margin:0;text-wrap:balance;animation:popIn .6s ease both}
.big-emoji{font-size:3.2rem;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}

/* Ronaldo vs Messi */
.pitch{position:relative;width:100%;height:58px}
.ball{position:absolute;left:0;bottom:0;font-size:2.2rem;animation:roll 2.6s ease-in-out infinite alternate}
@keyframes roll{to{left:calc(100% - 2.2rem);transform:rotate(720deg)}}
.goat{position:absolute;right:0;bottom:4px;font-size:2rem;animation:bob 1.2s ease-in-out infinite}
.dodge{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.siuu{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,11vw,4.4rem);color:var(--rose-deep);letter-spacing:.02em;animation:siuu .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes siuu{0%{transform:scale(.2) rotate(-12deg);opacity:0}60%{transform:scale(1.15) rotate(4deg);opacity:1}100%{transform:none}}
.shake{animation:shake .5s ease both}
.goat-big{font-size:clamp(5rem,26vw,9rem);line-height:1;animation:goatjump 1.1s cubic-bezier(.2,1.6,.4,1) both, bob 1.4s 1.1s ease-in-out infinite}
@keyframes goatjump{0%{transform:translateY(80px) scale(.2) rotate(-30deg);opacity:0}55%{transform:translateY(-30px) scale(1.15) rotate(360deg);opacity:1}100%{transform:rotate(360deg)}}
@keyframes shake{20%,60%{transform:translateX(-8px) rotate(-2deg)}40%,80%{transform:translateX(8px) rotate(2deg)}}

/* Final */
.final{gap:18px}
.line{font-family:var(--display);font-style:italic;font-size:clamp(1.35rem,4.6vw,1.8rem);margin:0;text-wrap:balance;animation:popIn .9s ease both}
.frame{
  width:min(380px,100%);aspect-ratio:4/5;max-width:100%;border-radius:28px;overflow:hidden;position:relative;
  border:8px solid var(--white);box-shadow:0 0 0 2px #f6b7cd,0 30px 60px -20px rgba(214,51,108,.55);
  animation:reveal 1.4s cubic-bezier(.2,.8,.2,1) both;
}
.frame img{width:100%;height:100%;object-fit:cover;display:block;animation:softzoom 9s ease-in-out infinite alternate}
@keyframes reveal{from{opacity:0;transform:scale(.7) rotate(-4deg);filter:blur(10px)}to{opacity:1;transform:rotate(-1.5deg);filter:none}}
@keyframes softzoom{from{transform:scale(1)}to{transform:scale(1.09)}}
.placeholder{width:100%;height:100%;display:grid;place-items:center;align-content:center;gap:8px;background:linear-gradient(160deg,#ffd1e1,#fff0f6);color:var(--rose-deep);font-weight:800;padding:20px}
.placeholder span{font-size:4rem;animation:beat 1.2s ease-in-out infinite}
.ily{font-family:var(--display);font-weight:800;font-size:clamp(4.5rem,22vw,8rem);line-height:.9;margin:6px 0 0;color:var(--rose-deep);animation:siuu 1s cubic-bezier(.2,1.6,.4,1) both, beat 1.6s 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}45%{transform:scale(1.05)}}
.msg{font-size:1.12rem;line-height:1.6;max-width:42ch;margin:0;color:var(--ink);animation:popIn .9s ease both}
.miss{font-family:var(--display);font-style:italic;font-weight:700;font-size:1.4rem;color:var(--rose);margin:0;animation:popIn .9s ease both}
.fade-late{animation-delay:.6s}

.music{
  position:fixed;z-index:5;
  top:calc(12px + env(safe-area-inset-top, 0px));right:calc(12px + env(safe-area-inset-right, 0px));
  width:46px;height:46px;border-radius:50%;background:var(--white);color:var(--rose-deep);
  font-size:1.3rem;box-shadow:0 6px 18px -6px rgba(214,51,108,.5);border:2px solid #f6b7cd;
}
.music[aria-pressed="true"]{background:var(--rose);color:var(--white);border-color:var(--rose)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}
</style>

const stage = document.getElementById('stage');
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------- Floating hearts + confetti ---------- */
const cv = document.getElementById('hearts'), cx = cv.getContext('2d');
let W, H, dpr; const parts = [];
function size(){ dpr = Math.min(devicePixelRatio||1,2); W = innerWidth; H = innerHeight; cv.width=W*dpr; cv.height=H*dpr; cx.setTransform(dpr,0,0,dpr,0,0); }
addEventListener('resize', size); size();
const COLORS = ['#f2709c','#ff9cbf','#ffc2d6','#d6336c','#ffffff'];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function drawHeart(x,y,s,rot,c,a){
  cx.save(); cx.translate(x,y); cx.rotate(rot); cx.scale(s/16,s/16); cx.globalAlpha=a; cx.fillStyle=c;
  cx.beginPath(); cx.moveTo(0,5); cx.bezierCurveTo(-14,-6,-6,-16,0,-8); cx.bezierCurveTo(6,-16,14,-6,0,5); cx.fill(); cx.restore();
}
function ambient(){ return {x:Math.random()*W, y:H+20, vx:(Math.random()-.5)*.3, vy:-(.3+Math.random()*.6), s:8+Math.random()*14, r:Math.random()*.6-.3, vr:(Math.random()-.5)*.01, c:COLORS[Math.random()*4|0], a:.25+Math.random()*.35, life:Infinity, sway:Math.random()*6.28} }
for(let i=0;i<22;i++){ const p=ambient(); p.y=Math.random()*H; parts.push(p); }
function burst(n=40, ox=W/2, oy=H/2, spread=1){
  for(let i=0;i<n;i++){ const ang=Math.random()*Math.PI*2, sp=(2+Math.random()*6)*spread;
    parts.push({x:ox,y:oy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-3,s:8+Math.random()*16,r:0,vr:(Math.random()-.5)*.2,c:COLORS[Math.random()*COLORS.length|0],a:1,life:140+Math.random()*80,g:.12,sway:0}); }
}
function rain(n=80){
  for(let i=0;i<n;i++) parts.push({x:Math.random()*W,y:-20-Math.random()*H*.6,vx:(Math.random()-.5)*1.2,vy:1.5+Math.random()*2.5,s:10+Math.random()*16,r:Math.random(),vr:(Math.random()-.5)*.08,c:COLORS[Math.random()*COLORS.length|0],a:1,life:260+Math.random()*120,g:.02,sway:Math.random()*6.28});
}
function tick(){
  cx.clearRect(0,0,W,H);
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i];
    p.sway+=.02; p.x+=p.vx+Math.sin(p.sway)*.3; p.y+=p.vy; if(p.g) p.vy+=p.g; p.r+=p.vr;
    if(p.life!==Infinity){ p.life--; if(p.life<40) p.a=p.life/40; }
    if(p.life<=0 || p.y>H+60){ parts.splice(i,1); continue; }
    if(p.life===Infinity && p.y<-30){ parts.splice(i,1); parts.push(ambient()); continue; }
    drawHeart(p.x,p.y,p.s,p.r,p.c,p.a);
  }
  requestAnimationFrame(tick);
}
if(!reduce) tick();

/* ---------- Soft music (generated, no file needed) ---------- */
let ac, musicOn=false, loopTimer, master;
const notes=[[523.25,659.25,783.99],[440,523.25,659.25],[349.23,440,523.25],[392,493.88,587.33]];
function playBar(i){
  const t=ac.currentTime; const chord=notes[i%4];
  chord.forEach((f,k)=>{ [0,0.5,1,1.5].forEach((d,j)=>{
    const o=ac.createOscillator(), g=ac.createGain(); o.type='sine';
    o.frequency.value = j%2 ? chord[(k+1)%3]*(k===2?2:1) : f;
    g.gain.setValueAtTime(0,t+d+k*.08); g.gain.linearRampToValueAtTime(.06,t+d+k*.08+.04); g.gain.exponentialRampToValueAtTime(.0008,t+d+k*.08+1.4);
    o.connect(g).connect(master); o.start(t+d+k*.08); o.stop(t+d+k*.08+1.5);
  });});
  loopTimer=setTimeout(()=>playBar(i+1),2000);
}
document.getElementById('music').onclick = e=>{
  const b=e.currentTarget;
  if(!ac){ ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=.8; master.connect(ac.destination); }
  musicOn=!musicOn; b.setAttribute('aria-pressed',musicOn); b.setAttribute('aria-label', musicOn?'Pause music':'Play romantic music');
  if(musicOn){ ac.resume(); playBar(0); } else { clearTimeout(loopTimer); ac.suspend(); }
};

/* ---------- Screens ---------- */
async function show(html){
  const old = stage.firstElementChild;
  if(old){ old.classList.add('leaving'); await wait(450); }
  stage.innerHTML = html; scrollTo({top:0});
  return stage.firstElementChild;
}

function welcome(){
  show(`<section class="screen">
    <div class="big-emoji">💌</div>
    <h1>Hey babyyy 💗<br>I've got 3 little questions for you 🥹</h1>
    <button class="btn solo" id="go">Let's gooo 💕</button>
  </section>`).then(()=>document.getElementById('go').onclick=e=>{ burst(30, e.clientX, e.clientY); q1(); });
}

async function ask({tag, emoji, q, a, b, reply, next}){
  const el = await show(`<section class="screen">
    <span class="tag">${tag}</span>
    <div class="big-emoji">${emoji}</div>
    <h2>${q}</h2>
    <div class="choices"><button class="btn" id="a">${a}</button><button class="btn alt" id="b">${b}</button></div>
  </section>`);
  const pick = async e => {
    burst(36, e.clientX, e.clientY);
    el.querySelector('.choices').outerHTML = `<p class="reply">${reply}</p>`;
    await wait(2600); rain(40); next();
  };
  el.querySelector('#a').onclick = pick; el.querySelector('#b').onclick = pick;
}

const q1 = () => ask({tag:'Question 1 · Our memories', emoji:'📸',
  q:'Have the best moments of your life been the ones we\'ve spent together? 🥹❤️',
  a:'YESSS, OF COURSE 🥰', b:'Every single moment 💗',
  reply:'Because every moment with you has been my favorite too. ❤️', next:()=>q2()});

const q2 = () => ask({tag:'Question 2 · Bali', emoji:'🌴',
  q:'Have you been thinking about me since Bali? 🥺💕',
  a:'ALL THE TIMEEE 😭❤️', b:'I miss you so muchhh 🥹',
  reply:'Because I haven\'t stopped thinking about you either. 🥺❤️', next:()=>q3()});

async function q3(){
  const el = await show(`<section class="screen">
    <span class="tag">Question 3 · The serious one</span>
    <div class="pitch" aria-hidden="true"><span class="ball">⚽</span><span class="goat">🐐</span></div>
    <h2>Okay babyyy, but you do know Ronaldo is better than Messi, right? 🐐⚽</h2>
    <div class="choices"><button class="btn" id="ron">SIUUU 🐐❤️</button><button class="btn alt dodge" id="mes">Nooo, Messi is better 😒</button></div>
  </section>`);
  const mes = el.querySelector('#mes'); let dodges = 0;
  const lines = ['Are you sure? 🤨','Really really?? 😒','Nice try babyyy 😂','Not allowed 🙅‍♂️','Just press SIUUU 🐐'];
  const runAway = () => {
    dodges++;
    const dx = (Math.random()>.5?1:-1)*(40+Math.random()*50), dy = (Math.random()>.5?1:-1)*(16+Math.random()*24);
    mes.style.transform = `translate(${dx}px,${dy}px) rotate(${dx>0?8:-8}deg)`;
    mes.textContent = lines[(dodges-1) % lines.length];
  };
  mes.addEventListener('mouseenter', runAway);
  mes.onclick = e => { e.preventDefault(); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); runAway(); };
  el.querySelector('#ron').onclick = async e => {
    burst(80, e.clientX, e.clientY, 1.4); rain(60);
    el.querySelector('.choices').outerHTML = `<div class="goat-big" aria-hidden="true">🐐🏆</div><div class="siuu">SIUUUUUU!</div><p class="reply">THAT'S MY GIRLLLL 😭❤️</p>`;
    await wait(3200); finale();
  };
}

async function finale(){
  const el = await show(`<section class="screen final" id="fin">
    <p class="line">Okay okay, jokes aside… 🥹❤️</p>
  </section>`);
  await wait(2000);
  el.insertAdjacentHTML('beforeend', `<p class="line">Even though I'm all the way in Paris…</p>`);
  await wait(2000);
  const photo = PHOTO_SRC
    ? `<img src="${PHOTO_SRC}" alt="Us, together">`
    : `<div class="placeholder"><span>💞</span>Our photo goes here</div>`;
  el.insertAdjacentHTML('beforeend', `<div class="frame">${photo}</div>`);
  rain(120); burst(70, W/2, H/3, 1.3);
  await wait(1300);
  el.insertAdjacentHTML('beforeend', `
    <p class="msg">I will always love you, and I will always be thinking of you, even from Paris. ❤️🇫🇷</p>
    <p class="miss fade-late">I miss you, babyyy. 🥹💕</p>
    <button class="btn solo fade-late" id="again" style="animation:popIn .9s 1.2s ease both">One more time? 💕</button>`);
  const heartLoop = setInterval(()=>rain(14), 2500);
  document.getElementById('again').onclick = () => { clearInterval(heartLoop); welcome(); };
}

welcome();
</script>
